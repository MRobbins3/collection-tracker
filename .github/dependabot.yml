# Monthly dependency updates. Minor + patch bumps are grouped into one PR per
# ecosystem; each major bump gets its own PR so breaking changes stay isolated.
#
# Not covered: versions typed as plain values in .github/workflows/ci.yml
# (go-version, bun-version, golangci-lint version, the postgres service
# images, runs-on). When a docker-compose bump lands, update the matching CI
# value in the same PR. See Documentation/dependencies.md (policy: ADR 0006).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "monthly"
    groups:
      go-modules:
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "monthly"
    groups:
      web-packages:
        update-types: ["minor", "patch"]
    ignore:
      # Type definitions follow the Node runtime pinned in .nvmrc; bump with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      compose-images:
        update-types: ["minor", "patch"]
    ignore:
      # A Postgres major can't read the previous major's data directory, so
      # it needs a planned dump-and-restore, not a PR. Tracked in next-steps.md.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
